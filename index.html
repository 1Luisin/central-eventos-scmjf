<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Ponto de entrada da Central de Eventos SCMJF."
  >
  <title>Central de Eventos SCMJF</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #fcf3f1 0%, #f7ece8 48%, #f3e5e2 100%);
      color: #4f2b30;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid rgba(139, 65, 77, 0.16);
      border-radius: 28px;
      background: rgba(255, 250, 248, 0.86);
      box-shadow: 0 18px 42px rgba(96, 45, 53, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: #7b5d62;
    }

    a {
      display: inline-flex;
      margin-top: 24px;
      padding: 14px 22px;
      border-radius: 999px;
      color: #fdfaf4;
      background: linear-gradient(135deg, #b35c68, #8b414d);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("./app/pages/dashboard/");
  </script>
</head>
<body>
  <main>
    <h1>Central de Eventos SCMJF</h1>
    <p>Redirecionando para o diretório principal da aplicação.</p>
    <a href="./app/pages/dashboard/">Abrir aplicação</a>
  </main>
</body>
</html>
