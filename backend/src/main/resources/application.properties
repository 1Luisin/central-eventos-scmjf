spring.application.name=central-eventos-api
spring.config.import=optional:file:./mail-local.properties
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=jdbc:oracle:thin:@172.18.2.192:1521:PRD1
spring.datasource.username=CN_EVENTOS
spring.datasource.password=EVENTOS@2025*
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=CN_EVENTOS
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.auth.interno.papel-comum=${INTERNAL_USER_ROLE_CODE:652}
app.auth.interno.papel-admin=${INTERNAL_ADMIN_ROLE_CODE:653}
app.auth.interno.usuario-schema=${MV_USER_SCHEMA:DBASGU}
app.auth.interno.prestador-schema=${MV_PRESTADOR_SCHEMA:DBAMV}
app.auth.interno.senha-function-schema=${MV_PASSWORD_FUNCTION_SCHEMA:DBASGU}
app.auth.interno.papel-function-schema=${MV_ROLE_FUNCTION_SCHEMA:DBAMV}
app.mail.from-address=${MAIL_FROM_ADDRESS:}
app.mail.from-name=${MAIL_FROM_NAME:Central de Eventos Santa Casa}
app.frontend.base-url=${FRONTEND_BASE_URL:http://127.0.0.1:3000}
app.security.password-recovery.expiration-minutes=${PASSWORD_RECOVERY_EXPIRATION_MINUTES:15}
app.security.password-recovery.max-attempts=${PASSWORD_RECOVERY_MAX_ATTEMPTS:5}
