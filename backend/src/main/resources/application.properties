spring.application.name=central-eventos-api
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=jdbc:oracle:thin:@172.18.2.192:1521:PRD1
spring.datasource.username=CN_EVENTOS
spring.datasource.password=EVENTOS@2025*
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=CN_EVENTOS
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

app.auth.interno.papel-comum=${INTERNAL_USER_ROLE_CODE:652}
app.auth.interno.papel-admin=${INTERNAL_ADMIN_ROLE_CODE:653}
app.auth.interno.mv-schema=${MV_AUTH_SCHEMA:DBAMV}
